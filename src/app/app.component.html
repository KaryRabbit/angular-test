<div class="app-shell" (window:resize)="onResize($event)">
  <mat-toolbar class="topbar">
    <button
      type="button"
      mat-icon-button
      class="menu-trigger"
      *ngIf="sidenavMode === 'over'"
      (click)="sidenavOpen = !sidenavOpen"
      aria-label="Toggle navigation"
    >
      <span class="menu-glyph">{{ sidenavOpen ? "✕" : "☰" }}</span>
    </button>

    <div class="title-block">
      <span class="title">Dashboard</span>
      <span class="subtitle"
        >Modernized UI, typed APIs, reusable module architecture</span
      >
    </div>

    <button
      type="button"
      mat-icon-button
      class="theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="
        isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'
      "
    >
      <mat-icon>{{ isDarkMode ? "light_mode" : "dark_mode" }}</mat-icon>
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="layout">
    <mat-sidenav [mode]="sidenavMode" [opened]="sidenavOpen" class="sidebar">
      <div class="sidebar-header">
        <h2>Navigation</h2>
        <p>Portfolio feature map</p>
      </div>

      <mat-nav-list>
        <a
          mat-list-item
          *ngFor="let item of navItems"
          [routerLink]="item.route"
          routerLinkActive="active-link"
          [routerLinkActiveOptions]="{ exact: item.route === '/' }"
          (click)="sidenavMode === 'over' ? (sidenavOpen = false) : null"
        >
          <mat-icon matListItemIcon class="nav-icon">{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
          <span matListItemLine>{{ item.description }}</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content>
      <main class="content">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
