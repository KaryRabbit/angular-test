<section class="table-shell">
  <div class="table-header">
    <div>
      <p class="eyebrow">Content Feed</p>
      <h1>Posts</h1>
    </div>
    <mat-form-field appearance="outline">
      <mat-label>Filter posts</mat-label>
      <input matInput (input)="applyFilter($any($event.target).value)" />
    </mat-form-field>
  </div>

  <div *ngIf="loading" class="state loading-state">
    <mat-spinner diameter="30"></mat-spinner>
    <span>Loading posts...</span>
  </div>

  <div *ngIf="error" class="state error-state">
    <p>{{ error }}</p>
    <button mat-flat-button color="primary" (click)="retry()">Retry</button>
  </div>

  <ng-container *ngIf="!loading && !error">
    <div class="table-card">
      <table mat-table [dataSource]="dataSource">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>ID</th>
          <td mat-cell *matCellDef="let post">{{ post.id }}</td>
        </ng-container>

        <ng-container matColumnDef="userId">
          <th mat-header-cell *matHeaderCellDef>User ID</th>
          <td mat-cell *matCellDef="let post">{{ post.userId }}</td>
        </ng-container>

        <ng-container matColumnDef="title">
          <th mat-header-cell *matHeaderCellDef>Title</th>
          <td mat-cell *matCellDef="let post">{{ post.title }}</td>
        </ng-container>

        <ng-container matColumnDef="body">
          <th mat-header-cell *matHeaderCellDef>Body</th>
          <td mat-cell *matCellDef="let post">{{ post.body }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell" [attr.colspan]="displayedColumns.length">No posts match your filter.</td>
        </tr>
      </table>

      <mat-paginator [pageSize]="defaultPageSize" [pageSizeOptions]="pageSizes"></mat-paginator>
    </div>
  </ng-container>
</section>
