<section class="form-shell">
  <header>
    <h1>Create Post</h1>
    <p>Validate payloads before creating a post against the API.</p>
  </header>

  <form [formGroup]="createForm" (ngSubmit)="onSubmit()" class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>User ID</mat-label>
      <input matInput type="number" formControlName="userId" />
      <mat-error *ngIf="createForm.controls['userId'].touched && createForm.controls['userId'].invalid">
        User ID must be a positive number.
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" />
      <mat-error *ngIf="createForm.controls['title'].touched && createForm.controls['title'].invalid">
        Title is required (min 5 chars).
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Body</mat-label>
      <textarea matInput rows="4" formControlName="body"></textarea>
      <mat-error *ngIf="createForm.controls['body'].touched && createForm.controls['body'].invalid">
        Body is required (min 10 chars).
      </mat-error>
    </mat-form-field>

    <button mat-flat-button color="primary" [disabled]="createForm.invalid || submitting" type="submit">
      {{ submitting ? 'Creating...' : 'Create post' }}
    </button>
  </form>
</section>
